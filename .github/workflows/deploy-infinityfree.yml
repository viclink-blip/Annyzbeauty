name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          # includes/config.php holds the live database password, so it is
          # edited on the server and never overwritten from the repo.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CNAME
            database/**
            includes/config.php
            assets/images/products/**
