name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Paystack secret key comes from a repository secret and is written
      # only on the runner, never committed.
      - name: Write Paystack key from secrets
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: python3 .github/scripts/write_paystack_secret.py

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # annyzbeauty.co.ke is served from its own folder on InfinityFree.
          server-dir: /annyzbeauty.co.ke/htdocs/
          # The live includes/config.php holds the database settings and is
          # managed on the server, so it is never overwritten.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CNAME
            database/**
            includes/config.php

      - name: Remove retired IntaSend files from the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; set cmd:fail-exit no; \
            rm -f /annyzbeauty.co.ke/htdocs/includes/intasend_config.php; \
            rm -rf /annyzbeauty.co.ke/htdocs/paymennts; bye"
