name: Snapshot live site

# Read-only: downloads the files currently on InfinityFree and commits them
# to the live-snapshot branch, so changes made on the server are not lost.
on:
  workflow_dispatch:
  push:
    branches: [claude/repo-signup-page-removal-z05yw2]
    paths: [.github/workflows/snapshot-live.yml]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List server folders
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; cls -1 --sort=name /; echo ---; cls -1 /htdocs; bye" | tee root-listing.txt

      - name: Download live site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # A custom domain gets its own folder on InfinityFree; fall back to /htdocs.
          SRC=/htdocs
          if grep -qx "annyzbeauty.co.ke/" root-listing.txt || grep -qx "annyzbeauty.co.ke" root-listing.txt; then
            SRC=/annyzbeauty.co.ke/htdocs
          fi
          echo "Downloading from $SRC"
          mkdir -p "$RUNNER_TEMP/live"
          # config.php holds the database password and must never be committed;
          # product images stay on the server.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow no; mirror --verbose \
            --exclude-glob config.php \
            --exclude-glob .ftp-deploy-sync-state.json \
            --exclude-glob 'assets/images/products/*' \
            $SRC $RUNNER_TEMP/live; bye"
          echo "$SRC" > "$RUNNER_TEMP/source.txt"
          find "$RUNNER_TEMP/live" -type f | sed "s|$RUNNER_TEMP/live/||" | sort

      - name: Commit to live-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B live-snapshot
          rsync -a --delete \
            --exclude .git --exclude .github --exclude database --exclude README.md --exclude CNAME \
            --exclude includes/config.php --exclude 'assets/images/products/' \
            "$RUNNER_TEMP/live/" ./
          git add -A
          git commit -m "Snapshot of live site from $(cat "$RUNNER_TEMP/source.txt")" || echo "No differences from main"
          git push -f origin live-snapshot
